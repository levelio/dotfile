# Fonts -------------------------------------------------------------------
# Keep in sync with Alacritty / Neovide: JetBrainsMono Nerd Font Mono, size 16.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
disable_ligatures never

# Window ------------------------------------------------------------------
remember_window_size  yes
initial_window_width  900c
initial_window_height 40c
window_padding_width  8
window_border_width   0
window_margin_width   0
background_opacity    1.0
hide_window_decorations no
confirm_os_window_close 0

# macOS: treat Option as Alt so <M-...> / terminal apps work like in Alacritty.
macos_option_as_alt both
macos_titlebar_color background

# Scrollback --------------------------------------------------------------
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Clipboard ---------------------------------------------------------------
copy_on_select no
strip_trailing_spaces never

# Tab bar -----------------------------------------------------------------
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style slanted
tab_title_template "{index}:{f' ' if num_windows == 1 else ' '}{tab.active_ol.wd.split('/')[-1] if tab.active_ol.wd else ''}{'' if num_windows == 1 else f' ({num_windows})'}"
active_tab_foreground   #c0caf5
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #1a1b26

# Cursor / bell -----------------------------------------------------------
cursor_shape            block
cursor_blink_interval   0
cursor_trail            1
cursor_trail_decay      0.08 0.22
cursor_trail_start_threshold 1
cursor_trail_color      none
enable_audio_bell       no
visual_bell_duration    0.0

# Theme -------------------------------------------------------------------
# TokyoNight Night, inlined to avoid depending on external theme files.
# Matches zellij + Alacritty.
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #33467c
cursor                  #c0caf5
cursor_text_color       #1a1b26
url_color               #7aa2f7

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue
color4  #7aa2f7
color12 #7aa2f7
# magenta
color5  #bb9af7
color13 #bb9af7
# cyan
color6  #7dcfff
color14 #7dcfff
# white
color7  #a9b1d6
color15 #c0caf5

# Shell -------------------------------------------------------------------
macos_custom_beam_cursor no

# Keyboard ----------------------------------------------------------------
# Use macOS-native tab ergonomics (iTerm/Terminal style).
# New tab, close tab, switch tabs, move tabs.
map cmd+t                 new_tab
map cmd+w                 close_tab
# Switch tabs: Cmd+Shift+H = prev, Cmd+Shift+L = next (vim-flavored H/L).
map cmd+shift+l           next_tab
map cmd+shift+h           previous_tab
map cmd+1                 goto_tab 1
map cmd+2                 goto_tab 2
map cmd+3                 goto_tab 3
map cmd+4                 goto_tab 4
map cmd+5                 goto_tab 5
map cmd+6                 goto_tab 6
map cmd+7                 goto_tab 7
map cmd+8                 goto_tab 8
map cmd+9                 goto_tab 9
map cmd+shift+right_bracket move_tab_forward
map cmd+shift+left_bracket  move_tab_backward

# New window splits inside a tab.
map cmd+d                 new_window
map cmd+shift+d           launch --location=vsplit --cwd=current
map cmd+]                 next_window
map cmd+[                 previous_window

# macOS paste from system clipboard (Cmd+V already pastes by default; keep explicit).
map cmd+v paste_from_clipboard
map cmd+c copy_to_clipboard

# Font zoom (matches Neovide Cmd +/- / 0).
map cmd+equal      change_font_size all +1.0
map cmd+minus      change_font_size all -1.0
map cmd+0          change_font_size all 0

# Reload config quickly.
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
